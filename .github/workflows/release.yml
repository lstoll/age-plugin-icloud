# Signed, notarized macOS .app.
# Snapshots (prereleases) on default-branch pushes; full releases on v* tags.
#
# Environment `release` holds DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD,
# and ASC_API_KEY_P8. Same-repo PRs from the owner can sign (artifact only).
# Forks never get the secrets. Never pull_request_target.
name: release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: Sign and notarize
    if: >
      github.repository == 'lstoll/age-plugin-icloud' &&
      !github.event.repository.fork &&
      (
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         github.actor == github.repository_owner) ||
        (github.event_name != 'pull_request' &&
         (github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/master' ||
          startsWith(github.ref, 'refs/tags/v')))
      )
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write # gh release create + upload zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: lstoll/keychain
          path: keychain
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Use checked-out keychain
        run: go mod edit -replace=lds.li/keychain=./keychain
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            v="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "tag=snapshot-$v" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Dist
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/dist.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: age-plugin-icloud-macos
          path: dist/*.zip
      - name: GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" dist/age-plugin-icloud-*.zip \
              --title "snapshot ${VERSION}" \
              --prerelease \
              --latest=false
          else
            gh release create "$TAG" dist/age-plugin-icloud-*.zip \
              --title "$TAG" \
              --generate-notes \
              --latest
          fi

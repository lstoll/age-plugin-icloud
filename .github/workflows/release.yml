# Signed, notarized macOS .app on version tags (v1.2.3).
# Secrets: APPLE_P12_BASE64, APPLE_P12_PASSWORD, APPLE_PROFILE_BASE64,
# APPLE_CODESIGN_IDENTITY, APPLE_TEAM_ID,
# APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_KEY_P8
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Import signing material
        env:
          APPLE_P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: ./scripts/ci-import-signing.sh
      - name: Sign
        env:
          CI: true
          RELEASE: "1"
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/sign.sh
      - name: Notarize
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: ./scripts/notarize.sh
      - name: Zip
        run: |
          mkdir -p dist
          ditto -c -k --keepParent age-plugin-icloud.app "dist/age-plugin-icloud-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-darwin.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: age-plugin-icloud-macos
          path: dist/*.zip
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: dist/age-plugin-icloud-*.zip
          generate_release_notes: true

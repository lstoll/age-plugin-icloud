# Signed, notarized macOS .app.
# Snapshots (prereleases) on default-branch pushes; full releases on v* tags.
#
# Repo Actions secrets: DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD,
# ASC_API_KEY_P8. Same-repo PRs from the owner can sign (artifact only).
# Forks never get the secrets. Never pull_request_target.
name: release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: Sign and notarize
    # Non-PR first so push/dispatch never evaluates pull_request.*.
    if: ${{ github.repository == 'lstoll/age-plugin-icloud' && !github.event.repository.fork && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner)) }}
    runs-on: macos-latest
    permissions:
      contents: write # gh release create + upload zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            v="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "tag=snapshot-$v" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Dist
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/dist.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: age-plugin-icloud-macos
          path: dist/*.zip
      - name: GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" dist/age-plugin-icloud-*.zip \
              --title "snapshot ${VERSION}" \
              --prerelease \
              --latest=false
          else
            gh release create "$TAG" dist/age-plugin-icloud-*.zip \
              --title "$TAG" \
              --generate-notes \
              --latest
          fi
      # GITHUB_TOKEN cannot trigger on: release workflows, so bump here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name != 'pull_request' && steps.version.outputs.prerelease != 'true'
        with:
          repository: lstoll/homebrew-tap
          path: homebrew-tap
          persist-credentials: false
      - name: Bump tap
        if: github.event_name != 'pull_request' && steps.version.outputs.prerelease != 'true'
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_GITHUB_TOKEN:-}" ]; then
            echo "TAP_GITHUB_TOKEN is required to push lstoll/homebrew-tap" >&2
            exit 1
          fi
          zip="dist/age-plugin-icloud-${VERSION}-darwin.zip"
          sha="$(shasum -a 256 "$zip" | awk '{print $1}')"
          python3 - "$VERSION" "$sha" <<'PY'
          import pathlib, re, sys
          version, sha = sys.argv[1], sys.argv[2]
          path = pathlib.Path("homebrew-tap/Casks/age-plugin-icloud.rb")
          text = path.read_text()
          text, n1 = re.subn(r'version "[^"]+"', f'version "{version}"', text, count=1)
          text, n2 = re.subn(r'sha256 "[^"]+"', f'sha256 "{sha}"', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"cask replace failed: version={n1} sha256={n2}")
          path.write_text(text)
          PY
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Casks/age-plugin-icloud.rb
          if git -C homebrew-tap diff --cached --quiet; then
            echo "cask already at ${VERSION}"
            exit 0
          fi
          git -C homebrew-tap commit -m "age-plugin-icloud ${VERSION}"
          git -C homebrew-tap push "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/lstoll/homebrew-tap.git" HEAD:main
